<!-- app.html -->
<h1>Control de inventario</h1>

<label>Nombre: <input [(ngModel)]="nombre"></label><br><br>
<label>Cantidad: <input type="number" [(ngModel)]="cantidad" min="0"></label><br><br>
<label>Precio: <input type="number" [(ngModel)]="precio" min="0"></label><br><br>

<button (click)="agregar()">Agregar producto</button>

@if (mensaje) { <p >{{ mensaje }}</p> }

<h2>Lista</h2>
<table border="1" cellpadding="8">
  <tr>
    <th>Nombre</th>
    <th>Cantidad</th>
    <th>Precio</th>
    <th>Valor total</th>
    <th>Acción</th>
  </tr>
  @for (p of productos; track p.id) {
    <tr>
      <td>{{ p.nombre }}</td>
      <td>{{ p.cantidad }}</td>
      <td>${{ p.precio }}</td>
      <td>${{ p.cantidad * p.precio }}</td>
      <td><button (click)="eliminar(p.id)">Eliminar</button></td>
    </tr>
  } @empty {
    <tr><td colspan="5">Inventario vacío.</td></tr>
  }
</table>
