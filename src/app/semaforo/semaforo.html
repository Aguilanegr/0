<h2>Semáforo</h2>

<button (click)="cambiar('red', 'Detenerse')">Rojo</button>
<button (click)="cambiar('yellow', 'Precaución')">Amarillo</button>
<button (click)="cambiar('green', 'Avanzar')">Verde</button>

<br><br>


<div style="width: 120px; height: 120px; border-radius: 50%; border: 2px solid black;"
     [style.backgroundColor]="color">
</div>

<br>


@switch (mensaje) {
  @case ('Detenerse') {
    <p style="color: red; font-weight: bold;">Detenerse</p>
  }
  @case ('Precaución') {
    <p style="color: orange; font-weight: bold;">Precaución</p>
  }
  @case ('Avanzar') {
    <p style="color: green; font-weight: bold;">Avanzar</p>
  }
  @default {
    <p>{{ mensaje }}</p>
  }
}
